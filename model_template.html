<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSE Factor Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eaeeec; --surface-3:#dfe5e2;
  --ink:#15201e; --ink-2:#4f5c59; --muted:#86928e; --line:#dde3e0; --line-2:#c9d1cd;
  --accent:#1f5fa8; --accent-ink:#174a84; --accent-soft:#dbe7f7; --accent-wash:rgba(31,95,168,.10);
  --up:#118a5e; --up-soft:#d9f0e6; --down:#c4432b; --down-soft:#f7ddd7; --warn:#c98a10; --warn-soft:#f8ecd0; --grey-soft:#e6e9e8;
  --bar-0:#dbe7f7; --bar-1:#9fc0ea; --bar-2:#5e93d6; --bar-3:#2f6fbe; --bar-4:#1f4f8f;
  --shadow:0 1px 2px rgba(21,32,30,.06), 0 8px 24px rgba(21,32,30,.06);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1312; --surface:#161b1a; --surface-2:#1d2423; --surface-3:#26302e;
    --ink:#edf1ef; --ink-2:#b3bdb9; --muted:#7c8884; --line:#28312f; --line-2:#36423f;
    --accent:#6fa4ea; --accent-ink:#9cc2f2; --accent-soft:#1c2d45; --accent-wash:rgba(111,164,234,.14);
    --up:#3cbb8a; --up-soft:#153327; --down:#e8735b; --down-soft:#3d221c; --warn:#e2a63c; --warn-soft:#3a2d14; --grey-soft:#242b29;
    --bar-0:#1c2d45; --bar-1:#274a75; --bar-2:#3a6aa8; --bar-3:#5b8fd6; --bar-4:#8fb6ee;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1312; --surface:#161b1a; --surface-2:#1d2423; --surface-3:#26302e;
  --ink:#edf1ef; --ink-2:#b3bdb9; --muted:#7c8884; --line:#28312f; --line-2:#36423f;
  --accent:#6fa4ea; --accent-ink:#9cc2f2; --accent-soft:#1c2d45; --accent-wash:rgba(111,164,234,.14);
  --up:#3cbb8a; --up-soft:#153327; --down:#e8735b; --down-soft:#3d221c; --warn:#e2a63c; --warn-soft:#3a2d14; --grey-soft:#242b29;
  --bar-0:#1c2d45; --bar-1:#274a75; --bar-2:#3a6aa8; --bar-3:#5b8fd6; --bar-4:#8fb6ee;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.cond{font-family:var(--cond)}
.lbl{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pos{color:var(--up)} .neg{color:var(--down)}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:6px 20px;display:flex;align-items:center;gap:14px;row-gap:6px;min-height:56px;white-space:nowrap;flex-wrap:wrap}
@media (max-width:1320px){.brand .asof{display:none}}
html{overflow-x:hidden}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.brand h1{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0}
.brand .asof{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.modes{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex:none}
.modes button{border:0;background:transparent;padding:6px 14px;white-space:nowrap;border-radius:6px;font-family:var(--cond);font-weight:600;font-size:13px;color:var(--ink-2)}
.modes button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.modes button.on.short{color:var(--down)} .modes button.on.long{color:var(--up)}
.top .sp{flex:1}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--surface-2);font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{background:var(--surface-2)}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:268px 1fr;min-height:calc(100vh - 56px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:16px 16px 40px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.main{padding:18px 22px 60px;min-width:0}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}

.sec{margin-bottom:18px}
.sec h3{font-family:var(--cond);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sec h3 button{border:0;background:none;color:var(--accent-ink);font-size:11px;letter-spacing:0;text-transform:none;padding:0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.field label{font-size:12px;color:var(--ink-2)}
.field input[type=text],.field select{border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;background:var(--surface);width:100%}
.field input[type=number]{border:1px solid var(--line-2);border-radius:7px;padding:5px 8px;background:var(--surface);width:100%;font-family:var(--mono);font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.tog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:3px 0;cursor:pointer}
.tog input{accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:5px 0;font-size:12px;color:var(--ink-2)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.w{display:grid;grid-template-columns:96px 1fr 26px;gap:8px;align-items:center;margin-bottom:5px;font-size:11.5px}
.w span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w span:first-child{color:var(--ink-2)}
.w input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.w .num{text-align:right;color:var(--ink)}
.w.f span:first-child::before,.w.t span:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:6px;vertical-align:1px}
.w.f span:first-child::before{background:var(--accent)} .w.t span:first-child::before{background:var(--up)}
.wsum{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.wsum b{color:var(--ink);font-family:var(--mono);font-weight:500}
.sectorlist{display:flex;flex-wrap:wrap;gap:5px}
.sectorlist button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--ink-2)}
.sectorlist button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

/* ---------- summary strip ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .lbl{margin-bottom:3px}
.tile .v{font-family:var(--cond);font-weight:600;font-size:22px;line-height:1.1}
.tile .d{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- table ---------- */
.tblhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.tblhead h2{font-family:var(--cond);font-size:16px;margin:0;font-weight:600}
.tblhead .sub{color:var(--muted);font-size:12px}
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:1080px}
thead th{position:sticky;top:0;background:var(--surface-2);font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th.r{text-align:right}
thead th.sorted{color:var(--accent-ink)}
thead th .arr{font-size:9px;margin-left:3px}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-wash)}
tbody tr.gated td{opacity:.55}
td.r{text-align:right}
.symcell{display:flex;flex-direction:column;line-height:1.2}
.symcell .sym{font-family:var(--cond);font-weight:700;font-size:13.5px;letter-spacing:.01em}
.symcell .nm{font-size:11px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.rank{font-family:var(--mono);color:var(--muted);font-size:12px;width:34px}
.scorebar{display:flex;align-items:center;gap:8px;min-width:120px}
.scorebar .bar{flex:1;height:8px;background:var(--bar-0);border-radius:2px;overflow:hidden}
.scorebar .bar i{display:block;height:100%;border-radius:0 2px 2px 0}
.scorebar b{font-family:var(--mono);font-weight:500;font-size:12.5px;width:36px;text-align:right}
.pstrip{display:flex;gap:2px;align-items:flex-end;height:18px}
.pstrip i{width:5px;background:var(--bar-2);border-radius:1px 1px 0 0;display:block;min-height:2px}
.pstrip i.f{background:var(--bar-3)} .pstrip i.t{background:var(--up)} .pstrip i.na{background:var(--line-2);height:2px!important}
.flagdots{display:inline-flex;gap:3px}
.flagdots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.flagdots i.red{background:var(--down)} .flagdots i.amber{background:var(--warn)} .flagdots i.grey{background:var(--line-2)}
.mqb{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:1px 6px;border-radius:9px;vertical-align:1px;white-space:nowrap}
.mqb.backed{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.mqb.accumulating{background:color-mix(in srgb,var(--acc,#4a7dff) 16%,transparent);color:var(--acc,#4a7dff)}
.mqb.hollow{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.mqb.covering{background:color-mix(in srgb,var(--down) 15%,transparent);color:var(--down)}
.verdict{font-weight:700;font-size:11px;letter-spacing:.5px;padding:2px 8px;border-radius:10px}
.verdict.hold{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.verdict.rotate{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.sectag{font-size:11px;color:var(--ink-2);background:var(--surface-2);padding:2px 7px;border-radius:5px;white-space:nowrap}
.star{border:0;background:none;color:var(--line-2);font-size:15px;padding:0 4px;line-height:1}
.star.on{color:var(--warn)}
.more{display:flex;justify-content:center;padding:12px}
.more button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 16px;font-size:12.5px}

/* ---------- stock page ---------- */
.back{border:0;background:none;color:var(--accent-ink);padding:0;margin-bottom:10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.shead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:18px;margin-bottom:14px}
.shead h2{font-family:var(--cond);font-weight:700;font-size:26px;margin:0;line-height:1.05;letter-spacing:-.01em}
.shead h2 small{font-weight:500;font-size:15px;color:var(--muted);margin-left:10px}
.shead .meta{color:var(--ink-2);font-size:12.5px;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.shead .desc{color:var(--ink-2);font-size:12.5px;margin-top:10px;max-width:68ch}
.scores3{display:flex;gap:10px}
.scores3 .sc{background:var(--surface-2);border-radius:10px;padding:8px 12px;min-width:104px;text-align:center}
.scores3 .sc .lbl{margin-bottom:2px}
.scores3 .sc .v{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1;color:var(--ink)}
.scores3 .sc .m{height:4px;background:var(--bar-0);border-radius:2px;margin:6px auto 0;width:70px;overflow:hidden}.scores3 .sc .m i{display:block;height:100%}
.scores3 .sc .g{font-size:10.5px;color:var(--muted);margin-top:3px}
.range52{margin-top:12px;max-width:520px}
.range52 .track{height:6px;background:var(--surface-3);border-radius:3px;position:relative;margin:4px 0}
.range52 .track i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);margin-left:-6px}
.range52 .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
@media (max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}.shead{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-family:var(--cond);font-size:14px;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.card h3 span{font-family:var(--sans);font-weight:400;font-size:11.5px;color:var(--muted)}
.pillars{display:flex;flex-direction:column;gap:4px}
.pl{display:grid;grid-template-columns:96px 1fr 36px;align-items:center;gap:10px;padding:4px 6px;border-radius:6px;cursor:pointer}
.pl:hover{background:var(--surface-2)}
.pl .n{font-size:12.5px;color:var(--ink-2)}
.pl .bar{height:9px;background:var(--bar-0);border-radius:2px;overflow:hidden}
.pl .bar i{display:block;height:100%;border-radius:0 2px 2px 0}
.pl .v{font-family:var(--mono);font-size:12px;text-align:right}
.pl.na .bar i{width:0} .pl.na .v{color:var(--muted)}
.pl .cov{font-size:10px;color:var(--muted);margin-left:4px}
.fx{margin:2px 0 6px 12px;border-left:2px solid var(--line-2);padding-left:10px;display:none}
.fx.open{display:block}
.fx div{display:grid;grid-template-columns:1fr 80px 46px;gap:8px;font-size:12px;padding:2px 0;color:var(--ink-2)}
.fx div .num{color:var(--ink)}
.fx div .pc{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px}
.kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--cond);font-weight:600}
.kv .v{font-family:var(--mono);font-size:13px;display:flex;justify-content:space-between;align-items:baseline}
.kv .v small{font-size:10.5px;color:var(--muted);font-family:var(--sans)}
.fin{width:100%;border-collapse:collapse;min-width:0}
.fin th,.fin td{padding:4px 8px;text-align:right;font-family:var(--mono);font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.fin th{font-family:var(--cond);font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.fin td:first-child,.fin th:first-child{text-align:left;font-family:var(--sans);color:var(--ink-2);position:sticky;left:0;background:var(--surface)}
.fin tr.sub td{color:var(--muted);font-size:11px}
.fin tr.hl td{font-weight:500;color:var(--ink)}
.finwrap{overflow-x:auto}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-radius:8px;font-size:12.5px;background:var(--surface-2)}
.flag.red{background:var(--down-soft)} .flag.amber{background:var(--warn-soft)} .flag.grey{background:var(--grey-soft);color:var(--ink-2)}
.flag i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
.flag.red i{background:var(--down)} .flag.amber i{background:var(--warn)} .flag.grey i{background:var(--muted)}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid1{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
@media (max-width:1100px){.plan{grid-template-columns:1fr}}
.plan .side{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.plan .side h4{margin:0 0 6px;font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.plan .side.long h4{color:var(--up)} .plan .side.short h4{color:var(--down)} .plan .side.lt h4{color:var(--accent-ink)}
.plan .side{min-width:0}
.plan .side > div,.plan .side .size > div{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0;color:var(--ink-2)}
.plan .side div b{text-align:right;font-family:var(--mono);font-weight:500;color:var(--ink);white-space:nowrap}
.plan .side div b.txt{font-family:var(--sans);font-size:11.5px;white-space:normal;max-width:60%}
.plan .side .size{display:block}
.grid2 > *,.grid3 > *{min-width:0}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .px{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .e20{fill:none;stroke:var(--up);stroke-width:1.5} .chart .e50{fill:none;stroke:var(--warn);stroke-width:1.5} .chart .e200{fill:none;stroke:var(--down);stroke-width:1.5}
.chart .vol{fill:var(--bar-1)}
.chart .wk{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .area{fill:var(--accent);opacity:.08}
.chart .lvl{stroke-width:1;stroke-dasharray:none}
.chart .cross{stroke:var(--muted);stroke-width:1}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-family:var(--mono);font-size:11.5px;z-index:50;display:none;line-height:1.4}
textarea.notes{width:100%;min-height:96px;border:1px solid var(--line-2);border-radius:8px;padding:8px;background:var(--surface);resize:vertical}
.secctx{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.secctx div{background:var(--surface-2);border-radius:8px;padding:7px 9px}
.secctx .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--cond);font-weight:600}
.secctx .v{font-family:var(--mono);font-size:12.5px}
.vs{font-size:10.5px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.help{font-size:11.5px;color:var(--muted);line-height:1.5}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:no-preference){.pl .bar i,.scorebar .bar i{transition:width .25s ease}}
/* ---------- views ---------- */
.views{display:flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:3px;flex:none}
.views button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-family:var(--cond);font-weight:600;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.views button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#filtersbtn{display:none}
/* ---------- regime ---------- */
.regime{display:grid;grid-template-columns:auto 1fr;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);align-items:start}
.regime .big{min-width:190px}
.regime .big .lbl{margin-bottom:2px}
.regime .big .v{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1.05}
.regime .big .v.trend{color:var(--up)} .regime .big .v.chop{color:var(--warn)}
.regime .big .d{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.breadth{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px 14px}
.breadth .b .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-family:var(--cond);font-weight:600;white-space:nowrap}
.breadth .b .v{font-family:var(--mono);font-size:13px}
.breadth .b .bar{height:5px;background:var(--bar-0);border-radius:2px;margin-top:4px;overflow:hidden}
.breadth .b .bar i{display:block;height:100%;background:var(--bar-3)}
.secstrip{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;grid-column:1/-1;min-width:0}
.regime > *{min-width:0}
.secstrip .sc{display:inline-flex;flex-direction:column;padding:5px 9px;border-radius:8px;background:var(--surface-2);font-size:11px;min-width:96px}
.secstrip .sc b{font-family:var(--cond);font-weight:600;font-size:11.5px;color:var(--ink)}
.secstrip .sc span{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.secstrip .sc.hot{background:var(--up-soft)} .secstrip .sc.cold{background:var(--down-soft)}
/* ---------- movers ---------- */
.movers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.movers h4{margin:0 0 5px;font-family:var(--cond);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.movers .lst{display:flex;flex-wrap:wrap;gap:4px}
.movers .lst button{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:2px 7px;font-family:var(--cond);font-weight:600;font-size:12px;color:var(--ink);cursor:pointer}
.movers .lst button small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:4px}
.movers .lst button.up small{color:var(--up)} .movers .lst button.dn small{color:var(--down)}
.delta{font-family:var(--mono);font-size:11px}
/* ---------- sizing ---------- */
.size{border-top:1px dashed var(--line-2);margin-top:8px;padding-top:6px}
.size .warn{color:var(--down)}
.cad{display:inline-block;font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
/* ---------- backtest / method ---------- */
.bt table{border-collapse:collapse;width:100%;min-width:720px}
.bt th,.bt td{padding:6px 9px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:right;font-family:var(--mono);white-space:nowrap}
.bt th{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bt td:first-child,.bt th:first-child{text-align:left;font-family:var(--sans)}
.prose{max-width:74ch;font-size:13.5px;line-height:1.6}
.prose h3{font-family:var(--cond);font-size:15px;margin:16px 0 6px}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px 18px;padding:0}
.prose li{margin-bottom:4px}
/* ---------- mobile ---------- */
@media (max-width:760px){
  body{font-size:13px}
  .top{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px;row-gap:8px}
  .brand h1{font-size:17px} .brand .asof{display:none}
  .modes{order:5;width:100%;overflow-x:auto} .modes button{padding:6px 10px;font-size:12px;flex:1}
  .views{order:6;width:100%} .views button{flex:1;padding:5px 6px;font-size:12px}
  #filtersbtn{display:inline-flex} #drawerClose{display:flex!important}
  #exportbtn{display:none}
  .wrap{display:block}
  .rail{display:none;position:fixed;inset:0;z-index:40;height:100vh;overflow-y:auto;padding:16px;border:0}
  body.drawer .rail{display:block}
  .main{padding:12px 10px 60px}
  .strip{grid-template-columns:1fr 1fr;gap:8px} .tile .v{font-size:18px}
  .regime{grid-template-columns:1fr;gap:10px} .regime .big{min-width:0}
  .breadth{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px} .breadth .b .v{font-size:12px} .breadth .b .k{white-space:normal;font-size:9.5px}
  .secstrip{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch} .secstrip .sc{flex:none}
  table{min-width:0} thead th,tbody td{padding:6px 6px}
  thead th:nth-child(2),tbody td:nth-child(2){position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:2px 0 0 var(--line)}
  thead th:nth-child(2){background:var(--surface-2)}
  tbody tr:hover td{background:var(--surface)} tbody tr:hover td:nth-child(2){background:var(--surface)}
  .symcell .nm{max-width:110px}
  .shead{padding:14px} .shead h2{font-size:21px} .shead h2 small{display:block;margin:2px 0 0;font-size:13px}
  .scores3{flex-wrap:wrap} .scores3 .sc{flex:1;min-width:90px}
  .grid2,.grid3{grid-template-columns:1fr}
  .plan{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr 1fr}
  .pl{grid-template-columns:84px 1fr 34px}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><h1>NSE Factor Desk</h1><span class="asof" id="asof"></span></div>
  <div class="modes" id="modes"></div>
  <div class="views" id="views"></div>
  <div class="sp"></div>
  <button class="iconbtn" id="filtersbtn">Filters</button>
  <button class="iconbtn" id="exportbtn" title="Download the current ranked list as CSV">CSV</button>
  <button class="iconbtn" id="themebtn" title="Theme: system / light / dark">Theme</button>
</div>
<div class="wrap">
  <aside class="rail" id="rail"></aside>
  <main class="main" id="main"></main>
</div>
<div class="tip" id="tip"></div>
<script id="data" type="application/json">__DATA__</script>
<script id="btdata" type="application/json">__BT__</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
let BT = null; try { BT = JSON.parse(document.getElementById('btdata').textContent) } catch(e) { BT = null }
const PDESC = {quality:'Returns on capital and margins — is this a good business?',growth:'Sales and profit growth, annual and latest quarter (date-matched)',balance:'Leverage, interest cover, dilution',cash:'Does profit turn into cash? CFO/PAT, FCF, other income, receivables',valuation:'P/E, P/B, EV/EBITDA, PEG — half-weighted against the sector',ownership:'Promoter/insider and institutional holding (current only)',trend:'Position vs 20/50/200 EMA, stack, 200 EMA slope',momentum:'3m, 6m, 12-1 returns and risk-adjusted momentum',rs:'Return relative to Nifty 500 over 3/6/12m and RS-line position',structure:'52w position, higher highs/lows, distance to breakout, efficiency, drawdown',volume:'Turnover, accumulation (up/down-day volume), volume expansion'};
const PILLARS = D.pillars, MODES = D.modes, INV = new Set(D.invert_for_short);
const FUND_P = new Set(['quality','growth','balance','cash','valuation','ownership']);
const PLABEL = {quality:'Quality',growth:'Growth',balance:'Balance sheet',cash:'Cash conversion',valuation:'Valuation',ownership:'Ownership',trend:'Trend',momentum:'Momentum',rs:'Rel. strength',structure:'Structure',volume:'Volume'};
const PSHORT = {quality:'Quality',growth:'Growth',balance:'Balance',cash:'Cash conv.',valuation:'Valuation',ownership:'Ownership',trend:'Trend',momentum:'Momentum',rs:'Rel. strength',structure:'Structure',volume:'Volume'};
const FL = { // factor label, format
  roce:['ROCE','pct'],roce_3y_avg:['ROCE 3y avg','pct'],roe:['ROE','pct'],roe_3y_avg:['ROE 3y avg','pct'],roa:['ROA','pct'],opm:['Operating margin','pct'],opm_delta:['OPM vs 3y avg','pp'],npm:['Net margin','pct'],
  sales_g3:['Sales CAGR 3y','pct'],sales_g1:['Sales growth 1y','pct'],pat_g3:['PAT CAGR 3y','pct'],pat_g1:['PAT growth 1y','pct'],q_rev_yoy:['Qtr sales YoY','pct'],q_pat_yoy:['Qtr PAT YoY','pct'],q_pat_accel:['PAT YoY acceleration','pp'],ttm_pat_vs_fy:['TTM PAT vs last FY','pct'],
  de:['Debt / equity','x'],net_debt_ebitda:['Net debt / EBITDA','x'],int_cover:['Interest cover','x'],dilution_3y:['Share count change 3y','pct'],current_ratio:['Current ratio','x'],leverage:['Assets / equity','x'],prov_pct_nii:['Provisions / NII','pct'],
  cfo_pat_3y:['CFO / PAT 3y','x'],cfo_pat:['CFO / PAT','x'],fcf_yield:['FCF yield','pct'],fcf_pos_years:['FCF-positive years (of 3)','n'],other_inc_pbt:['Other income / PBT','pct'],rec_days_delta:['Receivable days change','d'],
  pe:['P/E (TTM)','x'],pb:['P/B','x'],ev_ebitda:['EV / EBITDA','x'],peg:['PEG','x'],earnings_yield:['Earnings yield','pct'],promoter:['Promoter / insider holding','pct'],institutions:['Institutional holding','pct'],
  vs_ema200:['Price vs 200 EMA','pct'],vs_ema50:['Price vs 50 EMA','pct'],ema_stack:['EMA stack (20>50>200)','stack'],ema200_slope:['200 EMA slope (20d)','pct'],above_200_days:['Days above 200 EMA (of 60)','n'],
  ret_3m:['Return 3m','pct'],ret_6m:['Return 6m','pct'],mom_12_1:['Momentum 12-1','pct'],sharpe_6m:['Risk-adj. momentum 6m','x'],rs_3m:['RS vs Nifty 500, 3m','pct'],rs_6m:['RS vs Nifty 500, 6m','pct'],rs_12m:['RS vs Nifty 500, 12m','pct'],rs_line_pos_52:['RS line, 52w position','pos'],
  pos_52:['52-week range position','pos'],structure:['Higher highs + higher lows (0-4)','n'],dist_hi60:['Distance to 60d high','pct'],eff_ratio_60:['Efficiency ratio 60d','x2'],max_dd_1y:['Max drawdown 1y','pct'],
  turnover_20:['Turnover 20d (₹ Cr/day)','cr'],updown_vol_20:['Up-day / down-day volume','x'],vol_ratio_20_50:['Volume 20d / 50d','x'],
};
const CAPBANDS = {all:[0,Infinity],large:[20000,Infinity],mid:[5000,20000],small:[1000,5000]};

// ---------- state ----------
const LS = {get(k,d){try{const v=localStorage.getItem('nfd.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('nfd.'+k,JSON.stringify(v))}catch(e){}}};
const S = {
  mode:'longterm', view:'table', sym:null, limit:150,
  weights:Object.fromEntries(Object.keys(MODES).map(m=>[m,{...MODES[m].w}])),
  gates:Object.fromEntries(Object.keys(MODES).map(m=>[m,{...MODES[m].gates}])),
  useGates:true, hideGated:true,
  size:Object.assign({pot:4000000,riskPct:1,openRiskPct:5},LS.get('size',{})),
  f:{q:'',sectors:new Set(),cap:'all',turnover:0,noRed:false,lenders:true,minScore:0,minCov:0.6,stars:false},
  sort:{key:'score',dir:-1},
  stars:new Set(LS.get('stars',[])), notes:LS.get('notes',{}), book:new Set(LS.get('book',[])), bookTarget:LS.get('bookTarget',15),
};
const savedW = LS.get('weights',null); if(savedW){for(const m in savedW){if(S.weights[m])S.weights[m]={...S.weights[m],...savedW[m]}}}
// weights saved before the Aug-2026 backtest revision are reset once so the new swing defaults apply
if(LS.get('wver',0)<2){S.weights=Object.fromEntries(Object.keys(MODES).map(m=>[m,{...MODES[m].w}]));LS.set('weights',S.weights);LS.set('wver',2)}

// ---------- helpers ----------
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNum = v=>typeof v==='number'&&isFinite(v);
function fmtIN(n,dec=0){ if(!isNum(n))return '–'; const neg=n<0; n=Math.abs(n); let s=n.toFixed(dec); let [i,f]=s.split('.'); if(i.length>3){const last3=i.slice(-3); let rest=i.slice(0,-3); rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,','); i=rest+','+last3} return (neg?'-':'')+i+(f?'.'+f:'') }
const fmtCr = v=>isNum(v)?fmtIN(v/1e7,v/1e7>=1000?0:1):'–';
const pct = (v,d=1)=>isNum(v)?(v*100).toFixed(d)+'%':'–';
const spct = (v,d=1)=>isNum(v)?(v>0?'+':'')+(v*100).toFixed(d)+'%':'–';
const x = (v,d=1)=>isNum(v)?v.toFixed(d)+'x':'–';
const px = v=>isNum(v)?fmtIN(v,v<100?2:v<1000?1:0):'–';
function fmtF(key,v){ const f=(FL[key]||[key,'x'])[1]; if(!isNum(v))return '–';
  switch(f){case 'pct':return spct(v);case 'pp':return (v>0?'+':'')+(v*100).toFixed(1)+' pp';case 'x':return v.toFixed(2)+'x';case 'x2':return v.toFixed(2);case 'n':return String(Math.round(v));case 'd':return (v>0?'+':'')+v.toFixed(0)+'d';case 'cr':return fmtIN(v,1);case 'pos':return (v*100).toFixed(0)+'%';case 'stack':return v>0?'Bullish':v<0?'Bearish':'Mixed';default:return v.toFixed(2)} }
const cls = v=>!isNum(v)?'':v>0?'pos':v<0?'neg':'';
const barColor = s=>s>=80?'var(--bar-4)':s>=65?'var(--bar-3)':s>=50?'var(--bar-2)':s>=35?'var(--bar-1)':'var(--bar-0)';
function mcapBand(cr){return cr>=20000?'Large':cr>=5000?'Mid':'Small'}
const sectorMedian = (sec,k)=>{const s=D.sectors[sec];return s?s[k]:null};

// ---------- scoring ----------
function composite(st,mode){ const w=S.weights[mode], dir=MODES[mode].dir; let num=0,measured=0,wt=0; for(const p of PILLARS){const wp=w[p]||0; if(!(wp>0))continue; wt+=wp; let v=st.pillars[p]; if(!isNum(v)){v=50}else{measured+=wp; if(dir==='short'&&INV.has(p))v=100-v} num+=wp*v} return {score:wt>0?num/wt:null,cov:wt>0?measured/wt:0} }
function gateFails(st,mode){ const g=S.gates[mode],T=st.T,F=st.F,out=[]; if(!S.useGates)return out;
  if(g.min_bars&&(T.bars||0)<g.min_bars)out.push('history');
  if(g.turnover_min&&!((T.turnover_20||0)>=g.turnover_min))out.push('turnover');
  if(g.pat_positive&&!(F.pat_ttm>0))out.push('loss-making');
  if(g.above_ema200&&!(T.vs_ema200>0))out.push('below 200 EMA');
  if(g.below_ema200&&!(T.vs_ema200<0))out.push('above 200 EMA');
  if(g.atr_pct_min&&!((T.atr_pct||0)>=g.atr_pct_min))out.push('ATR too low');
  if(g.max_ext!=null&&isNum(T.vs_ema200)&&T.vs_ema200>g.max_ext)out.push('over-extended');
  if(g.pe_min&&isNum(F.pe)&&F.pe<g.pe_min)out.push('P/E < '+g.pe_min);
  if(g.other_inc_max&&isNum(F.other_inc_pbt)&&F.other_inc_pbt>g.other_inc_max)out.push('other income');
  if(g.dilution_max!=null){const dil=isNum(F.dilution_3y)?F.dilution_3y:F.dilution_hist; if(isNum(dil)&&dil>g.dilution_max)out.push('dilution')}
  if(g.cfo_pat_min!=null&&!st.lender&&isNum(F.cfo_pat_3y)&&F.cfo_pat_3y<g.cfo_pat_min)out.push('cash conversion');
  if(g.no_red&&st.n_red>0)out.push('red flag');
  return out }
// position sizing from the rulebook: risk = pot × risk%; qty = risk / (entry − stop)
function sizing(entry,stop){ const z=S.size; const riskRs=z.pot*z.riskPct/100; const per=Math.abs(entry-stop); if(!(per>0)||!(entry>0))return null;
  const qty=Math.floor(riskRs/per); const notional=qty*entry; const capRs=z.pot*z.openRiskPct/100;
  return {riskRs,per,qty,notional,pctPot:notional/z.pot,slots:Math.floor(capRs/riskRs),capRs} }
function fmtRs(v){ if(!isNum(v))return '–'; if(Math.abs(v)>=1e7)return '₹'+(v/1e7).toFixed(2)+' Cr'; if(Math.abs(v)>=1e5)return '₹'+(v/1e5).toFixed(2)+' L'; return '₹'+fmtIN(v,0) }
const MQL={backed:'Backed',accumulating:'Accumulating',hollow:'Hollow',covering:'Covering'};
function mqTitle(mq){ const t=[]; if(isNum(mq.ret5))t.push('5d '+spct(mq.ret5)); if(isNum(mq.dp))t.push('delivery '+mq.dp.toFixed(0)+'%'+(isNum(mq.dp_med)?' vs '+mq.dp_med.toFixed(0)+'% norm':'')); if(isNum(mq.oi5))t.push('OI 5d '+spct(mq.oi5)); if(isNum(mq.vr5))t.push('vol '+mq.vr5.toFixed(1)+'x');
  const why={backed:'move confirmed by real delivery / fresh OI',accumulating:'delivery spike + OI build, price quiet — someone is buying',hollow:'rally without delivery — churn, do not chase',covering:'rally on falling OI — short covering, exit not entry'};
  return (why[mq.st]||'')+' · '+t.join(' · ') }
function mqBadge(st){ const mq=st.mq; if(!mq||!mq.st)return ''; return `<span class="mqb ${mq.st}" title="${esc(mqTitle(mq))}">${MQL[mq.st]}</span>` }
function eligibleRows(){ computeRows(); return ROWS.filter(r=>isNum(r.score)&&!r.fails.length&&r.cov>=S.f.minCov).sort((a,b)=>b.score-a.score) }
let ROWS=[];
function computeRows(){ const m=S.mode; ROWS=D.stocks.map(st=>{const c=composite(st,m);return {st,score:c.score,cov:c.cov,fails:gateFails(st,m)}}) }
function filtered(){ const f=S.f,[lo,hi]=CAPBANDS[f.cap]; const q=f.q.trim().toUpperCase();
  return ROWS.filter(r=>{const s=r.st; if(q&&!(s.symbol.includes(q)||s.name.toUpperCase().includes(q)))return false; if(f.sectors.size&&!f.sectors.has(s.sector))return false; if(s.mcap_cr<lo||s.mcap_cr>=hi)return false; if(f.turnover&&!((s.T.turnover_20||0)>=f.turnover))return false; if(f.noRed&&s.n_red>0)return false; if(!f.lenders&&s.lender)return false; if(f.stars&&!S.stars.has(s.symbol))return false; if(!isNum(r.score))return false; if(r.score<f.minScore)return false; if(r.cov<f.minCov)return false; if(S.hideGated&&r.fails.length)return false; return true}) }
function sortRows(rows){ const {key,dir}=S.sort; const get=r=>{ if(key==='score')return r.score; if(key==='delta')return (r.st.hist||{})[S.mode]?.d1; if(key==='symbol')return r.st.symbol; if(key==='mcap')return r.st.mcap_cr; if(key==='price')return r.st.price; if(key==='flags')return r.st.n_red*10+r.st.n_amber; if(key.startsWith('p:'))return r.st.pillars[key.slice(2)]; if(key.startsWith('F:'))return r.st.F[key.slice(2)]; if(key.startsWith('T:'))return r.st.T[key.slice(2)]; return null };
  return rows.slice().sort((a,b)=>{const va=get(a),vb=get(b); const na=va==null||(typeof va==='number'&&!isFinite(va)),nb=vb==null||(typeof vb==='number'&&!isFinite(vb)); if(na&&nb)return 0; if(na)return 1; if(nb)return -1; if(typeof va==='string')return dir*va.localeCompare(vb); return dir*(va-vb)}) }

// ---------- columns per mode ----------
const COLS = {
  longterm:[['F:pe','P/E','x1'],['F:roce','ROCE','pct'],['F:sales_g3','Sales 3y','pct'],['F:pat_g3','PAT 3y','pct'],['F:cfo_pat_3y','CFO/PAT','x1'],['F:de','D/E','x1'],['T:vs_ema200','vs 200E','spct'],['T:rs_6m','RS 6m','spct']],
  swing_long:[['T:ret_3m','3m','spct'],['T:rs_6m','RS 6m','spct'],['T:vs_ema200','vs 200E','spct'],['T:pos_52','52w pos','pos'],['T:atr_pct','ATR%','pct'],['T:turnover_20','Turnover','cr'],['F:q_pat_yoy','Q PAT YoY','spct'],['F:roce','ROCE','pct']],
  swing_short:[['T:ret_3m','3m','spct'],['T:rs_6m','RS 6m','spct'],['T:vs_ema200','vs 200E','spct'],['T:pos_52','52w pos','pos'],['T:atr_pct','ATR%','pct'],['T:turnover_20','Turnover','cr'],['F:q_pat_yoy','Q PAT YoY','spct'],['F:pe','P/E','x1']],
};
function fmtCol(f,v){ if(!isNum(v))return '–'; switch(f){case 'x1':return v.toFixed(1)+'x';case 'pct':return (v*100).toFixed(1)+'%';case 'spct':return spct(v);case 'pos':return (v*100).toFixed(0)+'%';case 'cr':return fmtIN(v,0);default:return v} }

// ---------- render: top ----------
function renderTop(){
  $('#asof').textContent = `prices to ${D.asof} · ${D.n} stocks ≥ ₹${fmtIN(D.mcap_floor_cr)} Cr`;
  $('#modes').innerHTML = Object.keys(MODES).map(m=>`<button data-m="${m}" class="${S.mode===m?'on '+(MODES[m].dir==='short'?'short':m==='swing_long'?'long':''):''}">${esc(MODES[m].label)}</button>`).join('');
  $('#modes').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.sort={key:'score',dir:-1};if(S.view==='stock')S.view='table';render()});
  const VIEWS=[['table','Ranking'],['book','Book'],['watch','Watchlist'],['backtest','Backtest'],['method','Method']];

function gateText(m){const g=S.gates[m];const t=[];if(g.pat_positive)t.push('TTM profit > 0');if(g.above_ema200)t.push('above 200 EMA');if(g.below_ema200)t.push('below 200 EMA');if(g.min_bars)t.push(`≥ ${g.min_bars} bars`);if(g.pe_min)t.push(`P/E ≥ ${g.pe_min}`);if(g.other_inc_max)t.push(`other income ≤ ${Math.round(g.other_inc_max*100)}% of PBT`);if(g.dilution_max!=null)t.push(`dilution ≤ ${Math.round(g.dilution_max*100)}%`);if(g.cfo_pat_min!=null)t.push(`CFO/PAT 3y ≥ ${g.cfo_pat_min}`);return (S.useGates?'Active: ':'Off — ')+t.join(' · ')}

// ---------- regime + movers ----------
function regimePanel(){ const R=D.regime||{}; const B=R.breadth||{}; if(!isNum(R.eff_ratio_60))return '';
  const chop=R.regime==='CHOPPY';
  const bar=(k,v,l)=>`<div class="b"><div class="k">${l}</div><div class="v">${isNum(v)?(v*100).toFixed(0)+'%':'–'}</div><div class="bar"><i style="width:${isNum(v)?(v*100).toFixed(0):0}%"></i></div></div>`;
  const secs=Object.entries(D.sectors).filter(([k,v])=>k!=='Unknown'&&isNum(v.ret_1m)).sort((a,b)=>b[1].ret_1m-a[1].ret_1m);
  return `<div class="regime">
    <div class="big"><div class="lbl">Market regime · ${esc(R.index||'')}</div><div class="v ${chop?'chop':'trend'}">${chop?'CHOPPY':'TRENDING'}</div>
      <div class="d">60-day efficiency ratio ${R.eff_ratio_60.toFixed(3)} · ${Math.round(R.eff_ratio_pctl*100)}th pctile of the last 4y<br>Nifty 500 ${spct(R.ret_1m)} 1m · ${spct(R.ret_3m)} 3m · ${spct(R.vs_ema200)} vs 200E · ${spct(R.dd_from_high_1y)} from 1y high<br><span style="color:var(--ink-2)">${chop?'In chop the average name loses; only the top of the ranking has paid. Raise the bar, cut size.':'In a trend most gated names work; selection matters less than staying in.'}</span></div></div>
    <div class="breadth">${bar('a20',B.above_20,'Above 20 EMA')}${bar('a50',B.above_50,'Above 50 EMA')}${bar('a200',B.above_200,'Above 200 EMA')}${bar('bull',B.bull_stack,'Bull EMA stack')}${bar('bear',B.bear_stack,'Bear EMA stack')}
      <div class="b"><div class="k">52w highs / lows</div><div class="v"><span class="pos">${B.new_52w_high??'–'}</span> / <span class="neg">${B.new_52w_low??'–'}</span></div></div>
      <div class="b"><div class="k">Median 1m return</div><div class="v ${cls(B.median_ret_1m)}">${spct(B.median_ret_1m)}</div></div></div>
    <div class="secstrip">${secs.map(([k,v])=>`<div class="sc ${v.ret_1m>0.03?'hot':v.ret_1m<-0.03?'cold':''}" title="${esc(k)} · ${v.n} names · ${Math.round((v.pct_above_200||0)*100)}% above 200 EMA"><b>${esc(k)}</b><span>${spct(v.ret_1m)} 1m · ${spct(v.ret_3m)} 3m</span><span style="color:var(--muted)">${Math.round((v.pct_above_200||0)*100)}% &gt; 200E</span></div>`).join('')}</div>
  </div>` }
function moversPanel(){ const M=D.movers; const m=S.mode; if(!M)return '';
  const mm=(M.modes||{})[m]; if(!M.prev_date||!mm) return `<div class="card" style="margin-bottom:14px"><h3>What changed <span>first run — movers appear from the next refresh</span></h3></div>`;
  const chips=(arr,cl)=>arr.length?arr.map(x=>{const sym=typeof x==='string'?x:x.symbol;const d=typeof x==='string'?null:x.d;return `<button data-s="${sym}" class="${isNum(d)?(d>0?'up':'dn'):''}">${sym}${isNum(d)?`<small>${d>0?'+':''}${d.toFixed(1)}</small>`:''}</button>`}).join(''):'<span class="help">none</span>';
  return `<div class="card" style="margin-bottom:14px"><h3>What changed since ${esc(M.prev_date)} <span>${esc(MODES[m].label)} · top-50 membership and score moves</span></h3>
    <div class="movers"><div><h4>New in top 50</h4><div class="lst">${chips(mm.new_top50)}</div></div><div><h4>Dropped out of top 50</h4><div class="lst">${chips(mm.left_top50)}</div></div><div><h4>Biggest score gains</h4><div class="lst">${chips(mm.gainers)}</div></div><div><h4>Biggest score falls</h4><div class="lst">${chips(mm.losers)}</div></div><div><h4>Newly pass gates</h4><div class="lst">${chips(mm.newly_pass)}</div></div><div><h4>Newly fail gates</h4><div class="lst">${chips(mm.newly_fail)}</div></div></div></div>` }

function trackPanel(full){ const T=(D.track||{}).modes||{}; const rows=T[S.mode]||[]; if(!rows.length) return full?'<div class="card" style="margin-bottom:14px"><h3>Live track record <span>accumulates from the second daily build onward</span></h3><div class="help">Every build stores that day\'s top-10; from the next build this shows how each list has done since, against the gated universe from the same day. No look-ahead is possible — the lists were published before the returns happened.</div></div>':'';
  const show=full?rows:rows.slice(0,8);
  const avgT=rows.reduce((a,r)=>a+r.top10,0)/rows.length, avgU=rows.reduce((a,r)=>a+r.universe,0)/rows.length, beat=rows.filter(r=>r.top10>r.universe).length/rows.length;
  return `<div class="card" style="margin-bottom:14px"><h3>Live track record · ${esc(MODES[S.mode].label)} <span>${rows.length} past lists · top-10 avg ${spct(avgT)} vs universe ${spct(avgU)} · beat it ${(beat*100).toFixed(0)}% of the time</span></h3>
    <div class="finwrap bt"><table><thead><tr><th>Published</th><th>Days</th><th>Top-10 since</th><th>Gated universe since</th><th>Picks up</th><th style="text-align:left">The ten (return since)</th></tr></thead><tbody>${show.map(r=>`<tr><td>${r.date}</td><td>${r.days}</td><td class="${cls(r.top10)}"><b>${spct(r.top10)}</b></td><td class="${cls(r.universe)}">${spct(r.universe)}</td><td>${(r.hit*100).toFixed(0)}%</td><td style="text-align:left;font-family:var(--sans);font-size:11px">${r.picks.map(p=>`<span style="white-space:nowrap">${esc(p.s)} <span class="${cls(p.r)}">${spct(p.r,0)}</span></span>`).join(' · ')}</td></tr>`).join('')}</tbody></table></div>
    ${!full&&rows.length>8?`<div class="help" style="margin-top:6px">${rows.length-8} older lists in the Backtest tab.</div>`:''}</div>` }

// ---------- render: table ----------
function exchangePanel(){
  const N=D.nse; if(!N)return '';
  const by=Object.fromEntries(D.stocks.map(s=>[s.symbol,s]));
  const counts={backed:0,hollow:0,covering:0}; for(const s of D.stocks){const st=(s.mq||{}).st; if(st&&counts[st]!=null)counts[st]++}
  const tri=(N.trifecta||[]).filter(sym=>by[sym]);
  const stale=!N.fresh?`<span style="color:var(--warn)">exchange data is stale (${esc(N.asof)}) — run the morning pull</span>`:'';
  return `<div class="card xchg" style="margin-bottom:14px"><h3>Exchange tape <span>delivery % + futures OI · ${esc(N.asof)}</span></h3>
    <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12.5px">
      ${stale||`<span><span class="mqb backed">Backed</span> ${counts.backed}</span><span><span class="mqb hollow">Hollow</span> ${counts.hollow} <span style="color:var(--muted)">don't chase</span></span><span><span class="mqb covering">Covering</span> ${counts.covering} <span style="color:var(--muted)">exits, not entries</span></span>`}
      <span style="margin-left:auto"><b>Trifecta</b> <span style="color:var(--muted)" title="Delivery spike + futures OI build while price is still quiet — the strongest accumulation signal in our tests (+1.7%/20d excess). Rare by design.">?</span>:
      ${tri.length?tri.map(sym=>`<button class="iconbtn" data-s="${sym}" style="padding:2px 8px">${sym}</button>`).join(' '):'<span style="color:var(--muted)">none today — it fires a few times a week across the whole market</span>'}</span>
    </div></div>`;
}

  ${rows.length>S.limit?`<div class="more"><button id="more">Show ${Math.min(150,rows.length-S.limit)} more (${rows.length-S.limit} remaining)</button></div>`:''}</div>`;
  $('#main').querySelectorAll('thead th[data-k]').forEach(t=>t.onclick=()=>{const k=t.dataset.k;if(S.sort.key===k)S.sort.dir*=-1;else S.sort={key:k,dir:k==='symbol'?1:-1};renderMain()});

function closeStock(){S.view=S.viewBack||'table';S.sym=null;renderTop();renderMain()}
function factorRows(st,p){ return `<div style="grid-template-columns:1fr;color:var(--muted);font-style:italic">${esc(PDESC[p]||'')}</div>`+Object.entries(D.factors).filter(([k,f])=>f.pillar===p&&(st.lender?f.lender:f.nonlender)).map(([k,f])=>{const v=st[f.src][k];const pc=st.pct[k];return `<div><span>${esc((FL[k]||[k])[0])}${f.sector_rel?' <span class="vs">· sector-rel.</span>':''}</span><span class="num">${fmtF(k,v)}</span><span class="pc">${isNum(pc)?'p'+pc.toFixed(0):'–'}</span></div>`}).join('') }

  const m=S.mode; const secm=k=>sectorMedian(st.sector,k);

    <button class="star ${S.stars.has(st.symbol)?'on':''}" id="starbtn" title="Watchlist">★</button>
    <button class="iconbtn" id="bookbtn" style="vertical-align:6px;margin-left:6px">${S.book.has(st.symbol)?'✓ In book':'+ Book'}</button> ${mqBadge(st)}</div>
    <div class="range52"><div class="ends"><span>52w low ₹${px(T.lo52)}</span><span>${isNum(T.from_52h)?pcell(T.from_52h,v=>spct(v)+' from high'):''}</span><span>52w high ₹${px(T.hi52)}</span></div><div class="track"><i style="left:${(rng*100).toFixed(1)}%"></i></div></div>
    ${st.summary?`<div class="desc">${esc(st.summary)}${st.website?` <a href="${esc(st.website)}" target="_blank" rel="noopener">site ↗</a>`:''}</div>`:''}

      <div class="help" style="margin-top:8px">Sizing: ${fmtRs(S.size.pot)} pot · ${S.size.riskPct}% risk per trade · ${S.size.openRiskPct}% open-risk cap → at most ${Math.floor(S.size.openRiskPct/S.size.riskPct)} positions like this open at once. Change in the Sizing panel.</div>`})():'<div class="help">Not enough price history.</div>'}</div>

  // ---- charts
  html+=`<div class="grid2">

      <div style="display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;align-items:center">
      ${st.mq?`${st.mq.st?mqBadge(st)+' ':''}<span>Delivery <b>${isNum(st.mq.dp)?st.mq.dp.toFixed(0)+'%':'–'}</b>${isNum(st.mq.dp_med)?` <span style="color:var(--muted)">(norm ${st.mq.dp_med.toFixed(0)}%)</span>`:''}</span>${isNum(st.mq.oi5)?`<span>Fut. OI 5d <b class="${cls(st.mq.oi5)}">${spct(st.mq.oi5)}</b></span>`:''}${isNum(st.mq.vr5)?`<span>Volume <b>${st.mq.vr5.toFixed(1)}×</b> normal</span>`:''}${isNum(st.mq.ret5)?`<span>5d move <b class="${cls(st.mq.ret5)}">${spct(st.mq.ret5)}</b></span>`:''}`:''}
      ${st.filed?`<span style="border-left:1px solid var(--line-2);padding-left:16px">Filed ${esc(st.filed.pe||'')}${st.filed.audited?` <span style="color:var(--muted)">(${esc(st.filed.audited)}, standalone)</span>`:''}: ${isNum(st.filed.sales_cr)?`sales ₹${fmtIN(st.filed.sales_cr)} Cr${isNum(st.filed.sales_yoy)?` <b class="${cls(st.filed.sales_yoy)}">${spct(st.filed.sales_yoy)}</b>`:''} · `:''}PAT ₹${fmtIN(st.filed.pat_cr)} Cr${isNum(st.filed.pat_yoy)?` <b class="${cls(st.filed.pat_yoy)}">${spct(st.filed.pat_yoy)} YoY</b>`:''}${isNum(st.filed.eps)?` · EPS ${st.filed.eps}`:''}</span>`:''}
      </div></div>`:''}
    <div class="card"><h3>Last 80 sessions <span>close · 20 / 50 / 200 EMA · volume</span></h3><div id="chartD"></div><div class="legend"><span><i style="background:var(--ink)"></i>Close</span><span><i style="background:var(--up)"></i>20 EMA</span><span><i style="background:var(--warn)"></i>50 EMA</span><span><i style="background:var(--down)"></i>200 EMA</span></div></div>
    <div class="card"><h3>Two years, weekly <span>vs its own range</span></h3><div id="chartW"></div></div>
  </div>`;
  // ---- technicals grid
  html+=`<div class="grid2"><div class="card"><h3>Technical read</h3><div class="kv">
    ${kv('vs 20 / 50 / 200 EMA',`${pcell(T.vs_ema20,spct)} / ${pcell(T.vs_ema50,spct)} / ${pcell(T.vs_ema200,spct)}`)}
    ${kv('EMA stack',fmtF('ema_stack',T.ema_stack),isNum(T.ema200_slope)?'200E slope '+spct(T.ema200_slope):'')}
    ${kv('Returns 1w / 1m / 3m',`${pcell(T.ret_1w,spct)} / ${pcell(T.ret_1m,spct)} / ${pcell(T.ret_3m,spct)}`)}
    ${kv('Returns 6m / 12m',`${pcell(T.ret_6m,spct)} / ${pcell(T.ret_12m,spct)}`,'12-1: '+spct(T.mom_12_1))}
    ${kv('RS vs Nifty 500 3m / 6m / 12m',`${pcell(T.rs_3m,spct)} / ${pcell(T.rs_6m,spct)} / ${pcell(T.rs_12m,spct)}`)}
    ${kv('RS line 52w position',fmtF('rs_line_pos_52',T.rs_line_pos_52))}
    ${kv('52w range position',fmtF('pos_52',T.pos_52),'from high '+spct(T.from_52h))}
    ${kv('Structure (HH+HL of 4)',String(T.structure??'–'),`HH ${T.hh_count??'–'} · HL ${T.hl_count??'–'}`)}
    ${kv('20d range / ATR',isNum(T.tightness_atr)?T.tightness_atr.toFixed(1)+'x':'–','range '+pct(T.tightness_20))}
    ${kv('Bollinger width pctl',isNum(T.bb_width_pctl)?(T.bb_width_pctl*100).toFixed(0)+'%':'–',isNum(T.bb_width_pctl)&&T.bb_width_pctl<0.15?'squeeze':'')}
    ${kv('Efficiency ratio 60d',isNum(T.eff_ratio_60)?T.eff_ratio_60.toFixed(2):'–')}
    ${kv('Volatility 20d / 60d',`${pct(T.vol_20,0)} / ${pct(T.vol_60,0)}`,'ATR '+pct(T.atr_pct))}
    ${kv('Sharpe 3m / 6m',`${isNum(T.sharpe_3m)?T.sharpe_3m.toFixed(2):'–'} / ${isNum(T.sharpe_6m)?T.sharpe_6m.toFixed(2):'–'}`)}
    ${kv('Turnover 20d / 90d',`₹${fmtIN(T.turnover_20,1)} / ${fmtIN(T.turnover_90,1)} Cr`)}
    ${kv('Volume 20/50 · 5/50',`${x(T.vol_ratio_20_50,2)} · ${x(T.vol_ratio_5_50,2)}`)}
    ${kv('Up/down-day volume 20d',x(T.updown_vol_20,2),`${T.up_days_20??'–'} up days`)}
    ${kv('Max drawdown 1y',pct(T.max_dd_1y))}
    ${kv('Distance to 20d / 60d high',`${pct(T.dist_hi20)} / ${pct(T.dist_hi60)}`)}
  </div></div>
  <div class="card"><h3>Fundamental read <span>${st.lender?'lender metrics':'vs sector median'}</span></h3><div class="kv">
    ${kv('P/E (TTM)',x(F.pe),isNum(secm('pe'))?'sector '+x(secm('pe')):'')}${kv('P/B',x(F.pb))}${kv('EV / EBITDA',x(F.ev_ebitda))}${kv('PEG',x(F.peg,2))}${kv('Earnings yield',pct(F.earnings_yield))}${kv('Dividend yield',pct(F.div_yield))}
    ${kv('ROCE',pct(F.roce),isNum(secm('roce'))?'sector '+pct(secm('roce')):'')}${kv('ROCE 3y avg',pct(F.roce_3y_avg))}${kv('ROE',pct(F.roe))}${kv('ROA',pct(F.roa))}${kv('OPM',pct(F.opm),isNum(F.opm_delta)?'vs 3y '+fmtF('opm_delta',F.opm_delta):'')}${kv('Net margin',pct(F.npm))}
    ${kv('Sales growth 1y / 3y',`${pcell(F.sales_g1,spct)} / ${pcell(F.sales_g3,spct)}`,isNum(secm('sales_g3'))?'sector 3y '+spct(secm('sales_g3')):'')}${kv('PAT growth 1y / 3y',`${pcell(F.pat_g1,spct)} / ${pcell(F.pat_g3,spct)}`)}${kv('Latest qtr sales / PAT YoY',`${pcell(F.q_rev_yoy,spct)} / ${pcell(F.q_pat_yoy,spct)}`,isNum(F.q_pat_accel)?'accel '+fmtF('q_pat_accel',F.q_pat_accel):'')}${kv('TTM PAT vs last FY',spct(F.ttm_pat_vs_fy))}
    ${kv('Debt / equity',x(F.de,2))}${kv('Net debt / EBITDA',x(F.net_debt_ebitda))}${kv('Interest cover',x(F.int_cover))}${kv('Current ratio',x(F.current_ratio,2))}
    ${kv('CFO / PAT 1y / 3y',`${x(F.cfo_pat,2)} / ${x(F.cfo_pat_3y,2)}`)}${kv('FCF yield',pct(F.fcf_yield))}${kv('Capex / depreciation',x(F.capex_dep))}${kv('Other income / PBT',pct(F.other_inc_pbt))}
    ${kv('Receivable days',isNum(F.rec_days)?F.rec_days.toFixed(0):'–',isNum(F.rec_days_delta)?fmtF('rec_days_delta',F.rec_days_delta)+' YoY':'')}${kv('Inventory days',isNum(F.inv_days)?F.inv_days.toFixed(0):'–')}${kv('Share count 3y',spct(F.dilution_3y))}${kv('Gross block growth 1y',spct(F.gross_block_g1))}
    ${kv('Promoter / insider',pct(F.promoter))}${kv('Institutions',pct(F.institutions))}${kv('Analysts',isNum(F.analyst_n)?`${F.analyst_n} · ${esc(F.analyst_rec||'')}`:'–',isNum(F.analyst_upside)?'target '+spct(F.analyst_upside):'')}${kv('Beta',isNum(F.beta)?F.beta.toFixed(2):'–')}
    ${st.lender?kv('NII growth 1y',spct(F.nii_g1))+kv('Provisions / NII',pct(F.prov_pct_nii))+kv('Assets / equity',x(F.leverage)):''}
  </div></div></div>`;
  // ---- financial statements
  html+=`<div class="grid2"><div class="card"><h3>Annual <span>₹ Cr · FY ending ${fin.a_dates[0]||'–'}</span></h3><div class="finwrap">${finTable(fin,'a',st)}</div></div>
  <div class="card"><h3>Quarterly <span>₹ Cr · latest ${fin.q_dates[0]||'–'}</span></h3><div class="finwrap">${finTable(fin,'q',st)}</div>
  <h3 style="margin-top:14px">Sector context <span>${esc(st.sector)} · ${D.sectors[st.sector]?.n||0} names</span></h3><div class="secctx">${['ret_3m','ret_6m','vs_ema200','pct_above_200','pe','sales_g3','roce'].map(k=>{const v=secm(k);const lab={ret_3m:'Median 3m',ret_6m:'Median 6m',vs_ema200:'Median vs 200E',pct_above_200:'Above 200E',pe:'Median P/E',sales_g3:'Median sales 3y',roce:'Median ROCE'}[k];const f=k==='pe'?x(v):k==='pct_above_200'?pct(v,0):spct(v);return `<div><div class="k">${lab}</div><div class="v ${['pe','pct_above_200'].includes(k)?'':cls(v)}">${f}</div></div>`}).join('')}</div></div></div>`;
  $('#main').innerHTML=html;

function finTable(fin,which,st){
  const dates=which==='a'?fin.a_dates:fin.q_dates; const d=fin[which]; if(!dates.length)return '<div class="help">No statements available from the data source.</div>';
  const cr=v=>isNum(v)?fmtIN(v/1e7,Math.abs(v)/1e7<100?1:0):'–';
  const row=(label,arr,f=cr,cl='')=>`<tr class="${cl}"><td>${label}</td>${arr.map(v=>`<td>${f(v)}</td>`).join('')}</tr>`;
  const ratio=(a,b)=>a.map((v,i)=>isNum(v)&&isNum(b[i])&&b[i]!==0?v/b[i]:null);
  const yb=dt=>String(+dt.slice(0,4)-1)+dt.slice(4);
  const yoy=arr=>arr.map((v,i)=>{let j; if(which==='a'){j=i+1}else{j=dates.indexOf(yb(dates[i]))} const p=j>=0?arr[j]:null;return isNum(v)&&isNum(p)&&p>0?v/p-1:null});
  const fy=dt=>{const [y,mo]=dt.split('-');const m=+mo;if(which==='a')return m===3?'FY'+y.slice(2):dt.slice(0,7);const fyr=(+y+(m>3?1:0))%100;const q=m<=3?'Q4':m<=6?'Q1':m<=9?'Q2':'Q3';return q+' FY'+String(fyr).padStart(2,'0')};
  let h=`<table class="fin"><thead><tr><th></th>${dates.map(x=>`<th>${fy(x)}</th>`).join('')}</tr></thead><tbody>`;
  if(which==='a'){
    h+=row('Revenue',d.rev,cr,'hl')+row('growth',yoy(d.rev),spct,'sub');
    if(st.lender&&d.nii)h+=row('Net interest income',d.nii)+row('Provisions',d.prov);
    else h+=row('EBIT',d.ebit)+row('OPM',ratio(d.ebit,d.rev),pct,'sub')+row('EBITDA',d.ebitda)+row('Interest',d.interest)+row('Other income',d.other_inc);
    h+=row('PAT',d.pat,cr,'hl')+row('growth',yoy(d.pat),spct,'sub')+row('Net margin',ratio(d.pat,d.rev),pct,'sub')+row('EPS ₹',d.eps,v=>isNum(v)?v.toFixed(2):'–');
    h+=row('CFO',d.cfo)+row('CFO / PAT',ratio(d.cfo,d.pat),v=>x(v,2),'sub')+row('Capex',d.capex)+row('Free cash flow',d.fcf,cr,'hl')+row('Dividends paid',d.div);
    h+=row('Equity',d.equity)+row('Debt',d.debt)+row('Cash',d.cash)+row('D/E',ratio(d.debt,d.equity),v=>x(v,2),'sub')+row('ROE',ratio(d.pat,d.equity),pct,'sub');
    if(!st.lender)h+=row('Receivables',d.recv)+row('Inventory',d.inv)+row('Gross block',d.gross_block);
    h+=row('Shares (Cr)',d.shares,v=>isNum(v)?fmtIN(v/1e7,2):'–');
  } else {
    h+=row('Revenue',d.rev,cr,'hl')+row('YoY',yoy(d.rev),spct,'sub')+row('Operating profit',d.op)+row('OPM',ratio(d.op,d.rev),pct,'sub')+row('PAT',d.pat,cr,'hl')+row('YoY',yoy(d.pat),spct,'sub')+row('EPS ₹',d.eps,v=>isNum(v)?v.toFixed(2):'–');
  }
  return h+'</tbody></table>';
}

const tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';const w=tip.offsetWidth;tip.style.left=Math.min(window.innerWidth-w-8,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'}
function hideTip(){tip.style.display='none'}
function drawDaily(st){
  const el=$('#chartD'); const d=st.chart_d; if(!d||d.length<10){el.innerHTML='<div class="help">No price history.</div>';return}
  const W=560,H=260,L=8,R=52,Tp=10,B=22,VH=44; const n=d.length; const xs=i=>L+(i/(n-1))*(W-L-R);
  const lows=d.map(r=>Math.min(r[1],r[2],r[3],r[4])), highs=d.map(r=>Math.max(r[1],r[2],r[3],r[4]));
  let lo=Math.min(...lows), hi=Math.max(...highs); const pad=(hi-lo)*0.06||1; lo-=pad;hi+=pad;
  const ys=v=>Tp+(1-(v-lo)/(hi-lo))*(H-Tp-B-VH); const vmax=Math.max(...d.map(r=>r[5]))||1; const yv=v=>H-B-(v/vmax)*(VH-4);

  const lab=[0,Math.floor(n/2),n-1]; svg+=lab.map(i=>`<text class="ax" x="${xs(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${d[i][0].slice(5)}</text>`).join('');

function niceTicks(lo,hi,n){const span=hi-lo;const raw=span/n;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||raw;const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)out.push(+v.toFixed(6));return out}

    <p><strong>Scoring.</strong> Every factor is a percentile rank inside the universe (valuation factors half-weighted against the sector when the sector has ≥ 8 names). Factors average into eleven pillars; a pillar with under half its factors measured is blank and counts as neutral 50 in the composite. Banks, NBFCs, HFCs and insurers use a lender-specific factor set.</p>
    <h3>Pillars</h3><ul>${PILLARS.map(p=>`<li><strong>${PLABEL[p]}</strong> — ${esc(PDESC[p])}<br><span style="color:var(--muted);font-size:12px">${esc(fl(p))}</span></li>`).join('')}</ul>
    <h3>Modes</h3><ul>${Object.entries(MODES).map(([k,m])=>`<li><strong>${esc(m.label)}</strong> — review every ${esc(m.review)}. ${esc(m.hold_note)}<br><span style="color:var(--muted);font-size:12px">weights: ${PILLARS.filter(p=>m.w[p]>0).map(p=>`${PLABEL[p]} ${m.w[p]}`).join(' · ')}<br>gates: ${esc(gateText(k).replace(/^(Active|Off — ): ?/,''))}${m.gates.turnover_min?` · turnover ≥ ₹${m.gates.turnover_min} Cr/day`:''}${m.gates.atr_pct_min?` · ATR ≥ ${(m.gates.atr_pct_min*100).toFixed(1)}%`:''}${m.gates.max_ext!=null?` · ≤ ${Math.round(m.gates.max_ext*100)}% above 200 EMA`:''}</span></li>`).join('')}</ul>
    <p>The swing modes rank on technicals only and use fundamentals purely as gates because the point-in-time backtest showed fundamentals help over a year and are noise over weeks; the two-week review cadence and the extension cap come from the same test (see the Backtest tab).</p>
    <h3>Trade plan</h3><p>Swing long: trigger = 20-day high, stop = trigger − 2×ATR (alt: lower of 20-day low and 50 EMA), T1/T2 = +4/+6 ATR (1:2, 1:3). Short is the mirror on the 20-day low. Long-term: accumulate between the 50 and 200 EMA, stop at the lower of the 52-week low and 200 EMA − 8%. Sizing: risk = pot × risk %, quantity = risk ÷ (entry − stop).</p>
    <h3>Red flags</h3><p>CFO/PAT 3y &lt; 0.5 (red) / &lt; 0.8; interest cover &lt; 1.5 / &lt; 3; net debt/EBITDA &gt; 4; other income &gt; 30% of PBT; receivable days +20; inventory days +25; FCF negative three years; margins &gt; 8 pp above the 3y average on flat sales; dilution &gt; 25% / &gt; 10%; promoter &lt; 25%; TTM loss; P/E &gt; 80; latest quarter PAT &lt; −25%; ATR &lt; 1.2%; turnover &lt; ₹2 Cr; 1-year drawdown &gt; 50%; plus grey data-quality notes.</p>
    <h3>Data caveats</h3><p>Yahoo skips quarters, so TTM = latest FY + post-FY quarters − the same quarters a year earlier, or FY when a match is missing. Share counts are reconciled against PAT ÷ EPS (Yahoo's count is sometimes off by a clean multiple). No promoter pledge, no shareholding trend, no news, no F&amp;O flag. Nothing here is advice — it ranks where to spend research time.</p>
  </div></div>`}

function render(){ renderTop(); renderRail(); renderMain() }
render();
</script>
