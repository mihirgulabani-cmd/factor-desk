name: refresh-desk

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            screener_data/fundamentals
            screener_data/mcap.csv
            screener_data/universe_all.csv
          key: screener-data-${{ github.run_id }}
          restore-keys: screener-data-
      - name: Expire the universe list monthly
        run: |
          mkdir -p screener_data
          find screener_data -maxdepth 1 -name universe_all.csv -mtime +30 -delete || true
      - name: Pull data (Yahoo)
        run: |
          set +e
          python build_dataset.py --out screener_data --threads 3
          rc=$?
          if [ $rc -ne 0 ] && [ ! -s screener_data/universe_all.csv ]; then
            cp universe_seed.csv screener_data/universe_all.csv
            python build_dataset.py --out screener_data --threads 3
            rc=$?
          fi
          exit $rc
      - name: Score
        run: python screener_model.py --data screener_data
      - name: Build the desk
        run: python build_html.py --data screener_data --template model_template.html
      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            screener_data/fundamentals
            screener_data/mcap.csv
            screener_data/universe_all.csv
          key: screener-data-${{ github.run_id }}
      - name: Assemble site
        run: |
          mkdir -p site
          cp screener_data/NSE-Factor-Desk.html site/index.html
          cp screener_data/ranked_*.csv screener_data/factors.csv site/ 2>/dev/null || true
          echo "built $(date -u +'%Y-%m-%d %H:%M UTC')" > site/built.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: NSE-Factor-Desk
          path: site/index.html
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
